[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hidro"
version = "0.1.0"
description = "Control y monitoreo de un sistema hidroponico NFT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6.0.1",
    "influxdb-client>=1.44",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "smbus2>=0.4.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
hardware = [
    "gpiozero>=2.0",
    "lgpio>=0.2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hidro = "hidro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hidro = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=hidro --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["hidro"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "SIM108"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
