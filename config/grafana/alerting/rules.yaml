apiVersion: 1

groups:
  - orgId: 1
    name: hidro
    folder: Hidro
    interval: 1m
    rules:
      - uid: hidro-sin-datos
        title: hidro-core sin datos
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: hidro-influx
            model:
              refId: A
              rawQuery: true
              query: |
                from(bucket: "hidro")
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "heartbeat")
                  |> filter(fn: (r) => r._field == "value")
                  |> last()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: count
              settings:
                mode: ""
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        # La consulta ya cubre 10 minutos sin latidos: no se suma otra espera.
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: hidro-core no está publicando datos
          description: >-
            No hay latidos de hidro-core en InfluxDB. Revisar el contenedor,
            la alimentación y los logs de la Raspberry.
        isPaused: false
