apiVersion: 1

datasources:
  - name: InfluxDB hidro
    uid: hidro-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUX_TOKEN
